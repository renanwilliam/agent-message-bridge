name: Production deployment

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    # This must be a REPOSITORY variable, deliberately absent by default.
    if: >-
      vars.ENABLE_PRODUCTION_CD == 'true' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    runs-on: ubuntu-24.04
    # Keep the entire job within the AWS session lifetime; interrupted releases
    # remain in durable state and are reconciled by a later authorized run.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run demo
      - name: Mascarar identidade privada de implantação
        id: mask-deployment-identity
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_DEPLOY_ROLE_ID: ${{ secrets.AWS_DEPLOY_ROLE_ID }}
        run: |
          node <<'NODE'
          const arn = process.env.AWS_DEPLOY_ROLE_ARN ?? '';
          const roleId = process.env.AWS_DEPLOY_ROLE_ID ?? '';
          const role = /^arn:(?:aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role\/((?:[\x21-\x7e]+\/)?)([A-Za-z0-9_+=,.@-]{1,64})$/.exec(arn);
          if (!role || role[1].length > 511 || /[\r\n]/.test(arn + roleId) || !/^AROA[A-Z0-9]{17}$/.test(roleId)) {
            console.error('Missing or invalid private deployment identity.');
            process.exit(1);
          }
          const escape = value => value.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          process.stdout.write(`::add-mask::${escape(roleId)}\n::add-mask::${escape(role[2])}\n`);
          NODE
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-duration-seconds: 3600
          unset-current-credentials: true
      - name: Deploy verified commits to the existing production stack
        id: verified-deployment
        env:
          ENABLE_PRODUCTION_CD: ${{ vars.ENABLE_PRODUCTION_CD }}
          BRIDGE_CD_CONFIG_URI: ${{ secrets.BRIDGE_CD_CONFIG_URI }}
          BRIDGE_CD_CONFIG_VERSION: ${{ secrets.BRIDGE_CD_CONFIG_VERSION }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TARGET_SHA: ${{ github.sha }}
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: node scripts/ci-deploy.mjs
      - name: Teste funcional pós-deploy com destino autorizado
        env:
          TARGET_SHA: ${{ steps.verified-deployment.outputs.verified_commit }}
          BRIDGE_PROBE_CONFIG: ${{ secrets.BRIDGE_PROBE_CONFIG }}
          BRIDGE_PROBE_TOKEN: ${{ secrets.BRIDGE_PROBE_TOKEN }}
          BRIDGE_PROBE_EFFECT_TOKEN: ${{ secrets.BRIDGE_PROBE_EFFECT_TOKEN }}
        run: node --import tsx scripts/post-deploy-probe.ts
